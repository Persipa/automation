stages:
  - build
  - deploy_maven
  - deploy_docker

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

cache:
  paths:
    - .m2/repository

build:
  stage: build
  image: persipa/maven:3.9.8-eclipse-temurin-17
  script:
    - mvn clean package
  artifacts:
    paths:
      - '*/target/*.jar'
  rules:
    - if: '$CI_COMMIT_TAG'
deploy_maven:
  stage: deploy_maven
  image: persipa/maven:3.9.8-eclipse-temurin-17
  script:
    - mvn deploy
  dependencies:
    - build
  rules:
    - if: '$CI_COMMIT_TAG'
  artifacts:
    paths:
      - '*/target/*.jar'
deploy_docker:
  stage: deploy_docker
  image: docker:latest
  services:
    - docker:dind
  before_script:
    # Trust the self-signed certificate
    - mkdir -p /etc/docker/certs.d/$DOCKER_PUSH_REGISTRY
    - echo "$CI_REGISTRY_TLS_CA_CERTIFICATE" > /etc/docker/certs.d/$DOCKER_PUSH_REGISTRY/ca.crt
    # Start Docker daemon
    - docker info
  script:
    - docker login -u $DOCKER_USER -p $DOCKER_PASSWORD $DOCKER_PUSH_REGISTRY
    - cd automation-core
    - docker build --build-arg VERSION=$CI_COMMIT_TAG -t $DOCKER_PUSH_REGISTRY/persipa/automation:$CI_COMMIT_TAG -t $DOCKER_PUSH_REGISTRY/persipa/automation:latest .
    - docker push $DOCKER_PUSH_REGISTRY/persipa/automation:$CI_COMMIT_TAG
  dependencies:
    - build
  rules:
    - if: '$CI_COMMIT_TAG'